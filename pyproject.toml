[project]
name = "gateway"
version = "0.1.0"
description = ""
authors = [
    {name = "Eugene Tokarev",email = "to_ev@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "faststream[rabbit] (>=0.7.1,<0.8.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)"
]

[dependency-groups]
dev = [
    "ruff (>=0.15.20,<0.16.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
preview = true
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "E221",
    "E271",
    "UP047",
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403"]
"dependencies.py" = ["E402", "F401", "F403"]
